openapi: 3.0.3
info:
  title: Tusumba Ticketing & Payments API
  version: 1.0.0
  description: |
    API сервиса Ticketing & Payments по разделу «Билеты и записи» архитектуры Tusumba.
    Запись на бесплатные мероприятия, мои записи и билеты, список участников,
    кто из друзей идёт на мероприятие.
    Продажа и покупка билетов описаны черновиком (x-draft: true), реализация в Спринте 3.
    Внешний API доступен через API Gateway. Доступ - зарегистрированный пользователь.

    Общие правила:
    - ошибки: объект `error` с машинным кодом `code` и сообщением `message` для пользователя
      (#18886), для `validation_error` дополнительно `details` по полям;
    - списки: параметры `page` (с 1) и `size` (по умолчанию 20, максимум 100),
      ответ `items`, `total`, `page`, `size`;
    - платное мероприятие или бесплатное, определяет `is_free` из `GET /internal/events/{id}`
      events-service; цена покупки берётся из настроек продажи (`ticket_sales_settings`).
  x-task: https://ai.nsu.ru/issues/18892
externalDocs:
  description: Архитектура Tusumba
  url: https://ai.nsu.ru/projects/tusumba/wiki/Архитектура
security:
  - BearerAuth: []
tags:
  - name: registrations
    description: Записи на мероприятия
  - name: tickets
    description: Билеты пользователя
  - name: participants
    description: Участники мероприятия
  - name: sales
    description: Продажа и покупка билетов (черновик, Спринт 3)
paths:
  /v1/events/{id}/registration:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [registrations]
      operationId: registerForEvent
      summary: Записаться на бесплатное мероприятие или изменить запись
      description: |
        Сохраняет выбор пользователя: «Пойду» (`going`) или «Интересно» (`interested`) (#18115).
        Если запись уже есть, меняет её статус и видимость (запрос идемпотентный).
        Записаться можно только на бесплатное мероприятие, которое ещё не прошло.
        Признак `is_free` и дата запрашиваются у events-service (`GET /internal/events/{id}`).
        После изменения публикуется событие RegistrationChanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '201':
          description: Запись создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: |
            Записаться нельзя. Коды:
            `event_is_paid` - мероприятие платное, нужно купить билет;
            `event_finished` - мероприятие уже прошло.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: event_finished
                  message: Мероприятие уже прошло.
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [registrations]
      operationId: cancelRegistration
      summary: Отменить запись на мероприятие
      description: |
        Удаляет запись текущего пользователя. На прошедшее мероприятие запись не отменяется.
        Запись, созданную покупкой билета (`source = ticket`), отменить нельзя.
        После удаления публикуется событие RegistrationChanged.
      responses:
        '204':
          description: Запись отменена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Коды: `event_not_found` - мероприятие не найдено;
            `registration_not_found` - пользователь не записан на мероприятие.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: registration_not_found
                  message: Вы не записаны на это мероприятие.
        '409':
          description: |
            `event_finished` - мероприятие уже прошло;
            `registration_from_ticket` - запись создана покупкой билета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me/registrations:
    get:
      tags: [registrations]
      operationId: listMyRegistrations
      summary: Мои записи на мероприятия
      description: |
        Записи текущего пользователя, отсортированные по дате создания (новые первыми).
        Запись, созданная покупкой билета, отмечена `source = ticket`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Список записей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/me/tickets:
    get:
      tags: [tickets]
      operationId: listMyTickets
      summary: Мои билеты
      description: Купленные билеты текущего пользователя (статус sold), новые первыми.
      parameters:
        - name: event_id
          in: query
          required: false
          description: Только билеты на это мероприятие
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Список билетов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/tickets/{id}:
    get:
      tags: [tickets]
      operationId: getTicket
      summary: Билет
      description: Билет доступен только его владельцу. Чужой билет возвращает 404, чтобы не раскрывать его существование.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор билета
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Билет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`ticket_not_found` - билет не найден.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/events/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [participants]
      operationId: listParticipants
      summary: Список участников мероприятия
      description: |
        Участники - пользователи с бесплатной записью или купленным билетом, тип участия - в `source` (#18100).
        Доступно владельцу и администратору мероприятия (роль проверяется у events-service),
        остальным - 403. Анонимный участник возвращается без `user_id` и без персональных данных.
        Пустой список - штатный ответ 200.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Список участников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/events/{id}/friends-going:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [participants]
      operationId: listFriendsGoing
      summary: Кто из друзей идёт на мероприятие
      description: |
        Друзья текущего пользователя с записью на это мероприятие: «Пойду», «Интересно»
        или купленный билет (#18118). Друзья с видимостью `anonymous` не показываются.
        Список друзей запрашивается у identity-service (`GET /internal/users/{id}/friends`).
        Если никто из друзей не идёт, ответ 200 с пустым `items`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Друзья, которые идут на мероприятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendGoingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/events/{id}/ticket-settings:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [sales]
      x-draft: true
      operationId: getTicketSettings
      summary: Настройки продажи билетов (черновик)
      description: Доступно всем пользователям, чтобы показать цену и остаток билетов.
      responses:
        '200':
          description: Настройки продажи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            `event_not_found` - мероприятие не найдено;
            `ticket_settings_not_found` - продажа билетов не настроена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [sales]
      x-draft: true
      operationId: updateTicketSettings
      summary: Настроить продажу билетов (черновик)
      description: |
        Доступно владельцу и администратору мероприятия (роль проверяется у events-service).
        При сохранении создаются недостающие строки tickets со статусом available.
        Уменьшить количество ниже числа проданных и зарезервированных билетов нельзя.
        Настроить продажу можно только для платного мероприятия (`is_free = false` у events-service).
        Если мероприятие было бесплатным и на него уже есть бесплатные записи, настроить продажу нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketSettingsRequest'
      responses:
        '200':
          description: Настройки сохранены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: |
            `quantity_below_sold` - количество меньше уже проданных и зарезервированных билетов;
            `event_is_free` - мероприятие бесплатное, настройка продажи не нужна;
            `event_has_registrations` - на мероприятие уже есть записи с `source = free_signup`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/events/{id}/purchases:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [sales]
      x-draft: true
      operationId: createPurchase
      summary: Купить билеты (черновик)
      description: |
        Резервирует нужное количество билетов в одной транзакции
        (`SELECT ... FOR UPDATE SKIP LOCKED`) на 15 минут и создаёт платёж у провайдера.
        Клиент переходит по `confirmation_url` для оплаты.
        Если оплата не пришла до `expires_at`, фоновая задача возвращает билеты в продажу.
        Заголовок Idempotency-Key защищает от двойной покупки при повторе запроса:
        повтор с тем же ключом возвращает уже созданную покупку.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Уникальный ключ запроса, генерируется клиентом (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Билеты зарезервированы, платёж создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: |
            `tickets_sold_out` - свободных билетов меньше, чем запрошено;
            `sales_closed` - продажа не настроена, не открыта или мероприятие прошло;
            `event_is_free` - мероприятие бесплатное, нужна запись.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: tickets_sold_out
                  message: Билеты закончились.
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: '`payment_provider_error` - платёжный провайдер недоступен, резерв отменён.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/purchases/{id}:
    get:
      tags: [sales]
      x-draft: true
      operationId: getPurchase
      summary: Статус покупки (черновик)
      description: Клиент опрашивает статус после возврата со страницы оплаты. Доступно только покупателю.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор покупки (reservations.id)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Покупка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`purchase_not_found` - покупка не найдена.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/payments:
    post:
      tags: [sales]
      x-draft: true
      operationId: paymentWebhook
      summary: Уведомление платёжного провайдера (черновик)
      description: |
        Вызывается провайдером, а не клиентом, поэтому без JWT. Подпись запроса проверяется
        по правилам провайдера. Обработка идемпотентная: повторное уведомление
        с тем же статусом платежа ничего не меняет.
        При успешной оплате билеты переходят в sold, покупка - в paid, создаётся запись
        на мероприятие (`source = ticket`), обновляется `sales_stats`, публикуется событие TicketPurchased.
        Формат тела задаёт провайдер (кандидат - ЮKassa), здесь он не фиксируется.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Уведомление принято (в том числе повторное)
        '400':
          description: '`invalid_signature` - подпись не прошла проверку.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 проверяется каждым сервисом по публичному ключу Identity.
  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: Идентификатор мероприятия (events_db.events.id)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, с 1
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: |
        Ошибки проверки токена из tusumba-common:
        `not_authenticated` - «Требуется авторизация» (нет заголовка Authorization);
        `token_expired` - «Срок действия токена истёк» (клиент обновляет токен через `POST /v1/auth/refresh` и повторяет запрос);
        `invalid_token` - «Недействительный токен» (подпись неверна, токен испорчен или не access).
        Клиент выбирает действие по `code`, а не по тексту `message`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: token_expired
              message: Срок действия токена истёк
    Forbidden:
      description: '`forbidden` - у пользователя нет нужной роли в команде мероприятия.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав.
    EventNotFound:
      description: '`event_not_found` - мероприятие не найдено.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: event_not_found
              message: Мероприятие не найдено.
    ValidationError:
      description: '`validation_error` - тело или параметры запроса не прошли проверку.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Проверьте введённые данные.
              details:
                - field: quantity
                  message: Значение должно быть от 1 до 10.
  schemas:
    Error:
      type: object
      description: Ошибка в едином формате всех сервисов (tusumba-common, #18886)
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машинный код ошибки для клиента
            message:
              type: string
              description: Сообщение для пользователя
            details:
              type: array
              description: Ошибки по отдельным полям (для validation_error)
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
    Visibility:
      type: string
      description: |
        Кто видит участника:
        public - все; friends_only - только друзья; anonymous - имя скрыто от всех,
        организатор видит запись без персональных данных.
      enum: [public, friends_only, anonymous]
    RegistrationStatus:
      type: string
      description: going - «Пойду»; interested - «Интересно».
      enum: [going, interested]
    RegistrationSource:
      type: string
      description: free_signup - бесплатная запись; ticket - запись создана покупкой билета.
      enum: [free_signup, ticket]
    RegistrationRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
      description: Если `visibility` не передана, новая запись получает `public`, у существующей видимость не меняется.
    Registration:
      type: object
      description: Запись пользователя на мероприятие
      required: [id, event_id, status, visibility, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        source:
          $ref: '#/components/schemas/RegistrationSource'
        created_at:
          type: string
          format: date-time
    RegistrationPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Registration'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    Money:
      type: object
      description: Сумма в минимальных единицах валюты (копейках)
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          example: 50000
        currency:
          type: string
          enum: [RUB]
    Ticket:
      type: object
      description: Купленный билет
      required: [id, event_id, code, price, purchased_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        code:
          type: string
          description: Код билета для QR, билет предъявляется на входе (#18116)
        price:
          $ref: '#/components/schemas/Money'
        purchased_at:
          type: string
          format: date-time
    TicketPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    Participant:
      type: object
      description: |
        Участник мероприятия в списке организатора. Имя клиент получает у identity-service
        по `user_id`. У анонимного участника `user_id` равен null.
      required: [registration_id, user_id, status, visibility, source]
      properties:
        registration_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        source:
          $ref: '#/components/schemas/RegistrationSource'
    ParticipantPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    FriendGoing:
      type: object
      description: Друг, который идёт на мероприятие. Имя клиент получает у identity-service по `user_id`.
      required: [user_id, status, source]
      properties:
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        source:
          $ref: '#/components/schemas/RegistrationSource'
    FriendGoingPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FriendGoing'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    TicketSettingsRequest:
      type: object
      required: [price, quantity, sales_open]
      properties:
        price:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1
          description: Сколько всего билетов продаётся
        sales_open:
          type: boolean
          description: Открыта ли продажа
    TicketSettings:
      type: object
      required: [event_id, price, quantity, available, sales_open]
      properties:
        event_id:
          type: string
          format: uuid
        price:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
        available:
          type: integer
          description: Сколько билетов можно купить сейчас (status = available)
        sales_open:
          type: boolean
    PurchaseRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          description: Сколько билетов купить
    PurchaseStatus:
      type: string
      description: |
        pending - билеты зарезервированы, ждём оплату;
        paid - оплачено, билеты выданы;
        expired - время резерва вышло, билеты вернулись в продажу;
        failed - платёж отклонён, билеты вернулись в продажу.
      enum: [pending, paid, expired, failed]
    Purchase:
      type: object
      description: Покупка билетов (строка reservations)
      required: [id, event_id, status, quantity, total, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurchaseStatus'
        quantity:
          type: integer
        total:
          $ref: '#/components/schemas/Money'
        confirmation_url:
          type: string
          format: uri
          nullable: true
          description: Страница оплаты провайдера, есть пока статус pending
        expires_at:
          type: string
          format: date-time
          description: До какого времени держится резерв
        tickets:
          type: array
          description: Выданные билеты, есть при статусе paid
          items:
            $ref: '#/components/schemas/Ticket'
        created_at:
          type: string
          format: date-time
